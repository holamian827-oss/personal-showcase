name: Lighthouse

on:
  workflow_run:
    workflows: ['Deploy to GitHub Pages']
    types: [completed]

permissions:
  contents: read

jobs:
  audit:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Resolve live URL
        run: |
          OWNER="${{ github.repository_owner }}"
          REPO="${{ github.event.workflow_run.repository.name }}"
          CUSTOM="${{ vars.SITE_URL }}"

          if [ -n "$CUSTOM" ]; then
            echo "LH_URL=$CUSTOM" >> "$GITHUB_ENV"
          elif [ "$REPO" = "$OWNER.github.io" ]; then
            echo "LH_URL=https://$OWNER.github.io/" >> "$GITHUB_ENV"
          else
            echo "LH_URL=https://$OWNER.github.io/$REPO/" >> "$GITHUB_ENV"
          fi

      - name: Wait for Pages CDN
        run: sleep 20

      - name: Run Lighthouse CI
        run: npx lhci autorun

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse-report
          path: lighthouseci
          retention-days: 7

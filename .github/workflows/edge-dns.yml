name: Sync edge DNS

on:
  schedule:
    # 每 6 小时检查一次边缘 IP
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: edge-dns
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check Cloudflare credentials
        run: |
          if [ -z "${{ secrets.CF_API_TOKEN }}" ]; then
            echo "SKIP=1" >> "$GITHUB_ENV"
            echo "CF_API_TOKEN 未配置，跳过"
          fi

      - name: Sync apex A records
        if: env.SKIP != '1'
        run: node scripts/sync-edge-dns.mjs --apply --region-mode
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ZONE_ID: ${{ vars.CF_ZONE_ID }}
          EDGE_REGIONS: hk
          EDGE_COUNT: '4'
